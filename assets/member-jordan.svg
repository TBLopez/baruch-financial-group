<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Member of the week placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1c30"/>
      <stop offset="0.55" stop-color="#04101f"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a34c"/>
      <stop offset="1" stop-color="#c08e3c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- concentric ring motif (echoes the hero art) -->
  <g fill="none" stroke="rgba(255,255,255,0.08)">
    <circle cx="400" cy="230" r="150"/>
    <circle cx="400" cy="230" r="190"/>
    <circle cx="400" cy="230" r="230"/>
  </g>

  <!-- initials plate -->
  <circle cx="400" cy="225" r="88" fill="url(#chip)"/>
  <text x="400" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="72"
        fill="#04101f" text-anchor="middle" font-weight="700">JR</text>

  <!-- caption -->
  <rect x="300" y="352" width="200" height="1.5" fill="rgba(255,255,255,0.18)"/>
  <text x="400" y="396" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15"
        letter-spacing="3" fill="rgba(255,255,255,0.62)" text-anchor="middle">MEMBER OF THE WEEK</text>
  <text x="400" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="20"
        fill="#d4a34c" text-anchor="middle" font-style="italic">Add a portrait photo</text>
</svg>
